execution:
- concurrency: 10
  ramp-up: 5s
  hold-for: 30s
  scenario: login-carga

scenarios:
  login-carga:
    default-address: http://localhost:4444
    requests:
      - url: /autenticacion/login
        method: POST
        headers:
          Content-Type: application/json
        body: '{"nombre_usuario": "admin", "password": "admin"}' # Asegúrate de que este usuario exista en tu DB
        label: "Login de usuario"