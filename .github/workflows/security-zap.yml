name: OWASP ZAP Security Scan
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar servicios con Docker Compose
        run: |
          docker compose up -d --build --wait

      - name: Esperar a que el backend responda
        run: |
          for i in {1..5}; do
            if curl -s -f http://localhost:4444/ > /dev/null; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Ejecutar ZAP y generar reporte
        run: |
          # 1. Le damos un nombre a nuestro contenedor
          docker run --name zap-container --network host -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:4444 \
            -r /zap/wrk/report.html \
            -J /zap/wrk/report.json \
            -I

          # 2. Creamos la carpeta en GitHub Actions
          mkdir -p .zap

          # 3. Extraemos los archivos del contenedor a nuestra carpeta
          docker cp zap-container:/zap/wrk/report.html .zap/report.html
          docker cp zap-container:/zap/wrk/report.json .zap/report.json

          # 4. Borramos el contenedor
          docker rm zap-container

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-zap-final
          path: .zap/
          retention-days: 7
