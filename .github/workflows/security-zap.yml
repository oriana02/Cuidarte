name: OWASP ZAP Security Scan
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar servicios con Docker Compose
        run: |
          docker compose up -d --build --wait

      - name: Verificar que el backend responde
        run: |
          sleep 5
          curl -f http://localhost:4444/ || exit 1

      - name: Ejecutar ZAP directamente con Docker
        run: |
          mkdir -p .zap
          # Le damos permisos totales a la carpeta para que Docker pueda escribir
          chmod -R 777 .zap

          # Ejecutamos ZAP (escaneo rápido y pasivo)
          docker run --rm -v $(pwd)/.zap:/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:4444 \
            -r report.html \
            -J report.json \
            -c /zap/wrk/rules.tsv

      # Subimos los archivos manualmente usando la acción v4 de GitHub
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-zap-final
          path: .zap/
