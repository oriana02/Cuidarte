name: OWASP ZAP Security Scan
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar servicios con Docker Compose
        run: |
          docker compose up -d --build --wait
          # --wait espera a que los healthchecks pasen

      - name: Verificar que el backend responde
        run: |
          sleep 5
          curl -f http://localhost:4444/ || exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:4444'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: false   # pon true si quieres que falle el build ante alertas

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html