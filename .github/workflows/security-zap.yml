name: OWASP ZAP Security Scan
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar servicios con Docker Compose
        run: |
          docker compose up -d --build --wait

      - name: Esperar a que el backend responda
        run: |
          for i in {1..5}; do
            if curl -s -f http://localhost:4444/ > /dev/null; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Ejecutar ZAP (Acción Oficial)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:4444"
          # Le decimos a ZAP que ignore los WARN para que no falle el pipeline
          cmd_options: "-I"
          # ESTA ES LA CLAVE: un nombre de artefacto VÁLIDO (sin guiones)
          artifact_name: "zap_report"
