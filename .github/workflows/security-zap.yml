name: OWASP ZAP Security Scan

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar servicios con Docker Compose
        run: docker compose up -d --build --wait

      - name: Esperar a que el backend responda
        run: |
          for i in {1..20}; do
            if curl -s -f http://localhost:4444/ > /dev/null; then exit 0; fi
            sleep 3
          done
          echo "El backend no respondió a tiempo"
          docker compose logs
          exit 1

      # Los contenedores crean archivos como root (ej. BACKEND/uploads),
      # por eso se necesita sudo para abrir los permisos
      - name: Dar permisos de escritura a ZAP
        run: sudo chmod -R a+w "$GITHUB_WORKSPACE" || true

      - name: Ejecutar ZAP (Acción Oficial)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:4444"
          cmd_options: "-I"
          artifact_name: "zap_report"
          allow_issue_writing: false

      - name: Apagar servicios
        if: always()
        run: docker compose down -v
