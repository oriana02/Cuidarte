name: OWASP ZAP Security Scan

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar servicios con Docker Compose
        run: docker compose up -d --build --wait

      - name: Esperar a que el backend responda
        run: |
          for i in {1..20}; do
            if curl -s -f http://localhost:4444/ > /dev/null; then exit 0; fi
            sleep 3
          done
          echo "El backend no respondió a tiempo"
          docker compose logs
          exit 1

      - name: Dar permisos de escritura a ZAP
        run: sudo chmod -R a+w "$GITHUB_WORKSPACE" || true

      - name: Ejecutar ZAP
        run: |
          docker run --rm --network=host \
            -v "$GITHUB_WORKSPACE":/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:4444 \
            -J report_json.json -w report_md.md -r report_html.html -I

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_report
          path: |
            report_json.json
            report_md.md
            report_html.html